name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.14'
          - os: macos-latest
            python: '3.14'
          - os: windows-latest
            python: '3.10'
          - os: windows-latest
            python: '3.14'
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Run synthetic tests
        run: python -m unittest discover -v
      - name: Check CLI entry point
        run: python import_attachments.py --help
      - name: Check portable launcher
        run: python start.py --help
      - name: Verify official npm CLI on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP 'Bitwarden CLI test'
          npm install --global --prefix $prefix @bitwarden/cli@2026.8.0 --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:BITWARDENCLI_APPDATA_DIR = Join-Path $env:RUNNER_TEMP 'bw-test-profile'
          $env:BW_TEST_WRAPPER = Join-Path $prefix 'bw.cmd'
          python -c "import os, subprocess; from import_attachments import cli_command; subprocess.run([*cli_command(os.environ['BW_TEST_WRAPPER']), '--version'], check=True)"
      - name: Check macOS launcher syntax
        if: runner.os == 'macOS'
        run: zsh -n Start.command
